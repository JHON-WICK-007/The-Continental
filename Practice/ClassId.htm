<!DOCTYPE html>
<html lang="en">
<head>
    <title>class and id</title>
    <style> 
        #p1 {   
            background-color: yellow;                                    
            color: blue; 
            font-size:  20px;
        }

        .p2 {
            background-color: lightblue;
            color: green;
            font-size: 18px;
        }
    </style>
    <!-- # target to id, . target to class --> 
</head>

<body>
    <p id="p1">This is a paragraph with an id.</p>
    <p class="p2">This is a paragraph with a class.</p>
</body>
</html>
